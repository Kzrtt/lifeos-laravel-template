# Atrás do cloudflared: a borda fala HTTPS com o mundo e HTTP com a gente.
map $http_x_forwarded_proto $lifeos_https {
    default off;
    https   on;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 64m;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploads/mídias: o disco `public` mora no volume de storage do app (o symlink public/storage só existe lá).
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS $lifeos_https;
        fastcgi_read_timeout 120s;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) { deny all; }
}
