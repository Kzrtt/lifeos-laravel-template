# Deploy do LifeOS: nginx (porta 3000, a do cloudflared) -> php-fpm -> PostgreSQL 16.
# Subir:     docker compose -f compose.docker.yaml up -d --build
name: lifeos

x-app-env: &app-env
  APP_NAME: LifeOS
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-https://lifeos.example.com}
  APP_KEY: ${APP_KEY:-}
  APP_LOCALE: pt_BR
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: lifeos
  DB_USERNAME: lifeos
  DB_PASSWORD: ${DB_PASSWORD:-lifeos-secret}
  SESSION_DRIVER: database
  CACHE_STORE: database
  QUEUE_CONNECTION: sync
  LIFEOS_ENTITY_SLUG: ${LIFEOS_ENTITY_SLUG:-demo}
  LIFEOS_SESSION_KEY: ${LIFEOS_SESSION_KEY:-financas_master}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lifeos-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${WEB_PORT:-3000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - storage:/var/www/html/storage:ro

volumes:
  pgdata:
  storage:
