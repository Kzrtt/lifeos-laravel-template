# Infra local de desenvolvimento: só PostgreSQL 16 (sem Redis: fila sync, cache em banco).
# Alternativa ao Postgres do Homebrew. Produção usa o mesmo — sem banco-como-serviço.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: secret
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lifeos']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
